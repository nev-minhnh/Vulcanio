[package]
name = "vulcanio"
version = "1.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vulcanio — The all-in-one studio"
publish = false
default-run = "vulcanio"

[dependencies]
vulcanio-host = { path = "../../crates/vulcanio-host" }
lightcraft-embed = { path = "../../upstream/lightcraft/apps/lightcraft-embed" }
designcraft-embed = { path = "../../upstream/designcraft/apps/designcraft-embed" }
photocraft-embed = { path = "../../upstream/photocraft/apps/photocraft-embed" }
cadcraft-embed = { path = "../../upstream/cadcraft/apps/cadcraft-embed" }
figcraft-embed = { path = "../../upstream/figcraft/apps/figcraft-embed" }
vectorcraft-embed = { path = "../../upstream/vectorcraft/apps/vectorcraft-embed" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "clipboard", "wayland", "x11", "persistence", "default_fonts", "links"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
sys-locale = "0.3"
winit = { version = "0.30", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"
