# Publish a finished Windows build as a GitHub release (portable zip and installer).
name: Publish release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the successful 'Windows build' run"
        required: true
      version:
        description: "Version, e.g. 1.2.1"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vulcanio-${{ inputs.version }}-windows-x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          ls -la dist
          sha=$(gh api "repos/$REPO/actions/runs/${{ inputs.run_id }}" --jq .head_sha)
          # Notes come from packaging/release-notes/<version>.md on the default branch.
          gh api "repos/$REPO/contents/packaging/release-notes/$VERSION.md" -H "Accept: application/vnd.github.raw" > notes.md \
            || printf 'Vulcanio %s — The all-in-one studio. Windows 11 x64.\n\nBuilt from %s.\n' "$VERSION" "$sha" > notes.md
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber -R "$REPO"
          else
            gh release create "$TAG" dist/* -R "$REPO" --target "$sha" --title "Vulcanio $VERSION" --notes-file notes.md --latest
          fi
